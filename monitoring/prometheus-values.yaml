# Prometheus + Grafana Helm Values
#
# Usage:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm install monitoring prometheus-community/kube-prometheus-stack \
#     --namespace monitoring --create-namespace \
#     -f monitoring/prometheus-values.yaml
#
# Access Grafana:
#   kubectl port-forward svc/monitoring-grafana 3000:80 -n monitoring
#   Open http://localhost:3000
#   Login: admin / prom-operator

# ─── Grafana Configuration ──────────────────────

grafana:
  enabled: true

  adminPassword: "prom-operator"  # Change in production!

  # Pre-loaded dashboards for monitoring
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

  # Built-in dashboards
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: "Asia/Kolkata"

  # Resource limits (keep it light for a college project)
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # Persistence — save dashboards across restarts
  persistence:
    enabled: true
    size: 5Gi

# ─── Prometheus Configuration ───────────────────

prometheus:
  prometheusSpec:
    # How long to keep metrics data
    retention: 7d

    # Resource limits
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

    # Storage for metrics
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

    # Scrape interval — how often Prometheus collects metrics
    scrapeInterval: 30s
    evaluationInterval: 30s

# ─── Alertmanager Configuration ─────────────────

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

# ─── Node Exporter ──────────────────────────────
# Collects hardware and OS metrics from nodes

nodeExporter:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# ─── Kube State Metrics ─────────────────────────
# Collects Kubernetes object metrics (pods, deployments, etc.)

kubeStateMetrics:
  enabled: true
